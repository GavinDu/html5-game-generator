name: Go validation

# Avoid overlapping full validation runs for every commit in a fast-moving PR.
# A newer push supersedes stale validation for the same branch.
concurrency:
  group: go-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
      - feat/game-package-ir-contract

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Validate source before spending runners on browser jobs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting of new Go files
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following Go files need gofmt:"
            echo "$files"
            for file in $files; do gofmt -d "$file"; done
            exit 1
          fi
      - name: Run tests
        run: go test ./...
      - name: Run tests with the race detector
        run: go test -race ./internal/...
      - name: Static analysis
        run: go vet ./...

  # Phase 1 + Phase 4 of the fused detect-and-fix flow: every game in the
  # inventory must boot and play in a real browser before it can ship.
  # The matrix covers Chromium (desktop/Android engine) and WebKit (the
  # iOS WKWebView engine the app embeds). Reports and screenshots are
  # uploaded as artifacts; a FAIL on the gate checks fails the job.
  playtest:
    needs: test
    runs-on: ubuntu-latest
    # Run browsers sequentially: WebKit and Chromium are resource-heavy and
    # simultaneous matrix dispatch adds pressure without improving the gate.
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install playtest worker
        working-directory: tools/playtest
        run: npm install --no-audit --no-fund
      - name: Test standalone game quality scoring
        working-directory: packages/game-quality-score
        run: npm test
      - name: Test playtest and Pixi runtime safeguards
        working-directory: tools/playtest
        run: npm test
      - name: Install browser dependencies
        run: npx --prefix tools/playtest playwright install --with-deps ${{ matrix.browser }}
      - name: Build and start the server
        run: |
          go build -o /tmp/dq-server ./cmd/server
          PORT=18099 INVENTORY_DIR=inventory /tmp/dq-server > /tmp/dq-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:18099/healthz && break || sleep 1
          done
      - name: Playtest all feed games (${{ matrix.browser }})
        run: |
          set -o pipefail
          go run ./cmd/playtest -base http://localhost:18099 \
            -browser ${{ matrix.browser }} \
            -timeout 10m \
            -worker tools/playtest/probe.mjs \
            -shots /tmp/playtest-shots \
            | tee /tmp/playtest-report.json
      - name: Score browser report using per-game policies
        if: always()
        run: |
          if [ ! -s /tmp/playtest-report.json ]; then
            echo "::warning::Playtest worker produced no report (it may have timed out); skipping score aggregation."
            exit 0
          fi
          if ! node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (!Array.isArray(r.games)) process.exit(1)' /tmp/playtest-report.json 2>/dev/null; then
            echo "::warning::Playtest output is not a complete JSON report; skipping score aggregation."
            exit 0
          fi
          node tools/playtest/score-report.mjs /tmp/playtest-report.json - /tmp/scored-playtest-report.json --pack /tmp/evidence-packs --shots /tmp/playtest-shots
      - name: Upload playtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-${{ matrix.browser }}
          path: |
            /tmp/dq-server.log
            /tmp/playtest-report.json
            /tmp/playtest-shots/
            /tmp/evidence-packs/
          if-no-files-found: ignore

  # Playability Kit (user-mimic gate): plays each shipped game like a
  # user in Chromium and returns PLAYABLE / NEEDS_REVIEW / BROKEN.
  # A BROKEN verdict fails the job. Complements the playtest worker
  # (conformance/determinism/replay); the kit owns resilience, rule
  # coverage and issue classification for the repair loop.
  playability-kit:
    needs: playtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install kit and browser provider
        run: |
          npm --prefix tools/playtest install --no-audit --no-fund
          npm --prefix tools/playability-kit install --no-audit --no-fund
      - name: Install Chromium
        run: npx --prefix tools/playtest playwright install --with-deps chromium
      - name: Build and start the server
        run: |
          go build -o /tmp/dq-server ./cmd/server
          PORT=18099 INVENTORY_DIR=inventory /tmp/dq-server > /tmp/dq-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:18099/healthz && break || sleep 1
          done
      - name: Run the Playability Kit on the shipped games
        run: |
          node tools/playability-kit/playability.mjs \
            --base http://localhost:18099 \
            --games sample-rainbow-bear,sample-ribbon-sky,escape-from-injection \
            --budget 40 --out /tmp/kit-out
      - name: Upload kit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playability-kit
          path: |
            /tmp/dq-server.log
            /tmp/kit-out/
          if-no-files-found: ignore
