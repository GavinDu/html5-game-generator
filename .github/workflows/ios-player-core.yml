name: iOS Player Core

on:
  pull_request:
    paths:
      - "ios/GamePlayerCore/**"
      - ".github/workflows/ios-player-core.yml"
  push:
    branches: [main]
    paths:
      - "ios/GamePlayerCore/**"
      - ".github/workflows/ios-player-core.yml"

permissions:
  contents: read

concurrency:
  group: ios-player-core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Produce canonical Game Package fixture from Go HTTP handler
        env:
          EXPORT_SWIFT_PACKAGE_FIXTURE: ${{ runner.temp }}/backend-game-package.json
        run: go test ./internal/api -run '^TestExportCanonicalPackageForSwift
 -count=1
      - name: Show Swift toolchain
        run: swift --version
      - name: Run player contract and lifecycle tests against Go fixture
        working-directory: ios/GamePlayerCore
        env:
          GAME_PACKAGE_FIXTURE_PATH: ${{ runner.temp }}/backend-game-package.json
        run: swift test
