<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DoodleQuest Player — PixiJS + Rapier</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #0b0f22; color: #fff; }
  header { padding: 12px 16px; background: #1b2340; position: sticky; top: 0; z-index: 5;
           display: flex; align-items: baseline; gap: 12px; }
  header .title { font-size: 18px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .score { font-size: 16px; font-weight: 700; color: #ffd94d; }
  #stage { max-width: 430px; margin: 0 auto; padding: 10px; }
  #stage canvas { width: 100%; height: auto; display: block; border-radius: 14px; touch-action: none; }
  #status { max-width: 430px; margin: 4px auto 0; padding: 0 14px; min-height: 22px;
            font-size: 14px; color: #cfe0ff; text-align: center; }
  #end { display: none; max-width: 430px; margin: 10px auto; padding: 18px; text-align: center;
         background: #1b2340; border-radius: 14px; }
  #end .big { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
  #end button { margin-top: 10px; font-size: 16px; font-weight: 700; padding: 10px 22px;
                border: 0; border-radius: 10px; background: #ffd94d; color: #201a00; cursor: pointer; }
  /* Shell overlays (IR 1.2): the platform-owned start card and result
     card. They float over the stage (never below it), respect safe
     areas, and look identical in every shell game. */
  #stage-wrap { position: relative; max-width: 430px; margin: 0 auto; }
  .shell-card { display: none; position: absolute; inset: 0; z-index: 4;
                padding: max(18px, env(safe-area-inset-top)) 20px max(18px, env(safe-area-inset-bottom));
                background: rgba(8, 12, 30, 0.82); border-radius: 14px;
                flex-direction: column; align-items: center; justify-content: center;
                text-align: center; gap: 10px; }
  .shell-card.on { display: flex; }
  .shell-card .shell-title { font-size: 26px; font-weight: 800; line-height: 1.2; }
  .shell-card .shell-obj { font-size: 17px; font-weight: 700; color: #ffd94d; }
  .shell-card .shell-hint { font-size: 14px; color: #cfe0ff; }
  .shell-card .shell-stars { font-size: 30px; letter-spacing: 6px; color: #ffd94d; }
  .shell-card .shell-sub { font-size: 15px; color: #cfe0ff; }
  .shell-card button { margin-top: 8px; font-size: 17px; font-weight: 700; padding: 12px 28px;
                border: 0; border-radius: 12px; background: #ffd94d; color: #201a00; cursor: pointer;
                min-width: 44px; min-height: 44px; }
  @media (prefers-reduced-motion: reduce) { .shell-card { transition: none; } }
  #account { max-width: 560px; margin: 12px auto; padding: 12px 16px; background: #141a32; border-radius: 12px; display: grid; gap: 8px; }
  #account label { font-size: 13px; color: #cfe0ff; }
  #account input, #account select, #account button { min-height: 40px; border-radius: 8px; padding: 8px 10px; border: 1px solid #465174; background: #0b0f22; color: #fff; }
  #account .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  #account button { cursor: pointer; background: #ffd94d; color: #201a00; font-weight: 700; }
  #account-status { font-size: 12px; color: #cfe0ff; }
  #list { padding: 16px; display: grid; gap: 12px; max-width: 560px; margin: 0 auto; }
  .game-card { background: #1b2340; border-radius: 14px; padding: 16px; }
  .game-card a { color: #fff; text-decoration: none; font-size: 17px; font-weight: 700; }
  .game-card .sub { color: #9fb2ff; font-size: 13px; margin-top: 4px; }
  details { max-width: 430px; margin: 14px auto; padding: 0 14px 20px; }
  summary { color: #9fb2ff; font-size: 13px; cursor: pointer; }
  #devlog { background: #070a18; border-radius: 10px; padding: 10px; font-size: 11px;
            line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow: auto; }

  /* Mobile-first player shell: safe-area aware, keyboard accessible, and
     responsive to rotation without stretching the logical game canvas. */
  :root {
    color-scheme: dark;
    --dq-bg: #0b0f22;
    --dq-surface: #151d37;
    --dq-surface-raised: #1b2340;
    --dq-border: #465174;
    --dq-text: #ffffff;
    --dq-muted: #cfe0ff;
    --dq-accent: #ffd94d;
    --dq-radius: 14px;
    --dq-space-1: 4px;
    --dq-space-2: 8px;
    --dq-space-3: 12px;
    --dq-space-4: 16px;
    --dq-space-5: 24px;
  }
  html { min-height: 100%; background: var(--dq-bg); }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: radial-gradient(ellipse at top, #182447 0%, var(--dq-bg) 56%);
    overscroll-behavior-y: contain;
  }
  header {
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
    background: rgba(20, 28, 54, .94);
    border-bottom: 1px solid rgba(159, 178, 255, .16);
    backdrop-filter: blur(14px);
  }
  #stage-wrap { width: min(100%, 520px); padding: 0 10px; }
  #stage { width: 100%; padding: 8px 0; }
  #stage canvas {
    width: 100%;
    max-height: min(72dvh, 900px);
    object-fit: contain;
    background: #080c1e;
    border: 1px solid rgba(159, 178, 255, .18);
    border-radius: var(--dq-radius);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #status { padding: 4px 18px; line-height: 1.45; }
  #account, .game-card, #end {
    border: 1px solid rgba(159, 178, 255, .16);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .16);
  }
  #account { width: min(calc(100% - 24px), 560px); }
  #account input:focus-visible, #account select:focus-visible,
  #account button:focus-visible, .shell-card button:focus-visible,
  #end button:focus-visible, a:focus-visible, summary:focus-visible {
    outline: 3px solid var(--dq-accent);
    outline-offset: 3px;
  }
  button, input, select { font: inherit; }
  button { min-height: 44px; }
  #list { width: min(100%, 600px); }
  .game-card { transition: border-color .16s ease, transform .16s ease; }
  .game-card:hover { border-color: rgba(255, 217, 77, .55); }
  .game-card a { display: inline-block; padding: 4px 0; line-height: 1.4; }
  .game-card .sub { line-height: 1.5; }
  #devlog { border: 1px solid rgba(159, 178, 255, .18); }
  @media (min-width: 760px) {
    body { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
    header { margin: 0 calc(-1 * max(16px, env(safe-area-inset-left))); }
    #stage-wrap { width: min(100%, 600px); }
    #stage canvas { max-height: 78dvh; }
    #account { margin-top: 20px; }
    #list { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 900px; }
  }
  @media (orientation: landscape) and (max-height: 600px) {
    header { padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: 6px; }
    header .title { font-size: 15px; }
    #stage-wrap { width: min(56vw, 460px); }
    #stage { padding: 4px 0; }
    #stage canvas { max-height: calc(100dvh - 64px); }
    #status { min-height: 0; font-size: 12px; }
    #account { margin-top: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

</style>
<script type="importmap">
{
  "imports": {
    "pixi.js": "/web/vendor/pixi.min.mjs",
    "@dimforge/rapier2d-compat": "/web/vendor/rapier.es.js"
  }
}
</script>
</head>
<body>
<header>
  <div class="title" id="title">DoodleQuest</div>
  <div class="score" id="score"></div>
</header>
<div id="stage-wrap">
  <div id="stage"></div>
  <div class="shell-card" id="shell-start">
    <div class="shell-title" id="shell-start-title"></div>
    <div class="shell-obj" id="shell-start-obj"></div>
    <div class="shell-hint" id="shell-start-hint"></div>
    <button id="shell-start-btn" type="button">▶ Start</button>
  </div>
  <div class="shell-card" id="shell-result">
    <div class="shell-title" id="shell-result-title"></div>
    <div class="shell-stars" id="shell-result-stars"></div>
    <div class="shell-sub" id="shell-result-sub"></div>
    <button id="shell-again-btn" type="button">Play again</button>
  </div>
</div>
<div id="status">Loading…</div>
<div id="end">
  <div class="big" id="end-title"></div>
  <div id="end-sub"></div>
  <button id="again" type="button">Play again</button>
</div>
<section id="account" aria-label="Account and social feed">
  <label for="bearer-token">Account session token (provided by your trusted sign-in provider)</label>
  <input id="bearer-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste short-lived bearer token">
  <div class="controls">
    <button id="save-token" type="button">Use session</button>
    <button id="clear-token" type="button">Sign out</button>
    <label for="feed-scope">Feed</label>
    <select id="feed-scope" aria-label="Feed scope">
      <option value="for_you">For You</option>
      <option value="following">Following</option>
      <option value="friends">Friends</option>
      <option value="newest">Newest</option>
    </select>
    <button id="refresh-feed" type="button">Refresh</button>
  </div>
  <div id="account-status" role="status" aria-live="polite">Public games can be browsed without signing in. Social actions require a valid session token.</div>
</section>
<div id="list"></div>
<details>
  <summary>Developer log</summary>
  <pre id="devlog"></pre>
</details>
<script type="module" src="/web/pixi-runtime.js"></script>
</body>
</html>
