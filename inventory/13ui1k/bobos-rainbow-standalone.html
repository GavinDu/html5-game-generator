<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bobo's Rainbow — DoodleQuest</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #10142b; color: #fff; }
  header { padding: 14px 18px; font-size: 20px; font-weight: 700; background: #1b2340; position: sticky; top: 0; z-index: 5; }
  header small { display: block; font-size: 12px; font-weight: 400; color: #9fb2ff; }
  #list { padding: 16px; display: grid; gap: 12px; max-width: 560px; margin: 0 auto; }
  .game-card { background: #1b2340; border-radius: 14px; padding: 16px; display: flex; align-items: center; gap: 12px; }
  .game-card .info { flex: 1; }
  .game-card .title { font-size: 18px; font-weight: 700; }
  .game-card .meta { font-size: 13px; color: #9fb2ff; margin-top: 4px; }
  .game-card button { background: #4f7cff; color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font-size: 16px; font-weight: 700; }
  #empty { text-align: center; color: #9fb2ff; padding: 60px 20px; }
  #play { display: none; max-width: 480px; margin: 0 auto; padding: 12px; }
  #stage { position: relative; width: 100%; aspect-ratio: 390 / 844; background: #000; border-radius: 14px; overflow: hidden; touch-action: none; }
  #stage canvas { width: 100%; height: 100%; display: block; }
  #backbar { display: flex; gap: 10px; margin-bottom: 10px; }
  #backbar button { background: #2a3358; color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; font-size: 15px; }
  #endcard { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10, 14, 35, .82); }
  #endcard .box { background: #1b2340; border-radius: 18px; padding: 28px; text-align: center; width: 82%; }
  #endcard h2 { margin: 0 0 8px; font-size: 26px; }
  #endcard p { color: #9fb2ff; margin: 6px 0 18px; }
  #endcard button { background: #4f7cff; color: #fff; border: 0; border-radius: 12px; padding: 14px 26px; font-size: 17px; font-weight: 700; margin: 4px; }
  #err { display:none; background:#5b1f1f; color:#ffd7d7; border-radius:10px; padding:12px; margin-top:10px; font-size:13px; white-space:pre-wrap; }
</style>
</head>
<body>
<header>🎮 DoodleQuest Player<small>games generated from kids' drawings</small></header>

<div id="list"></div>

<div id="play">
  <div id="backbar"><button id="back">← Games</button></div>
  <div id="stage">
    <canvas id="cv" width="390" height="844"></canvas>
    <div id="endcard"><div class="box">
      <h2 id="endtitle">You win!</h2>
      <p id="endsub"></p>
      <button id="again">Play again</button>
      <button id="togames">Games</button>
    </div></div>
  </div>
  <div id="err"></div>
</div>

<script>
var STANDALONE = {"manifest": {"name": "Bobo's Rainbow", "assets": {"sprites": [{"id": "bear", "src": "sprites/bear"}, {"id": "kitten", "src": "sprites/kitten"}, {"id": "heart", "src": "sprites/heart"}, {"id": "heart_blue", "src": "sprites/heart_blue"}, {"id": "band0", "src": "sprites/band0"}, {"id": "band1", "src": "sprites/band1"}, {"id": "band2", "src": "sprites/band2"}, {"id": "band3", "src": "sprites/band3"}, {"id": "band4", "src": "sprites/band4"}, {"id": "band5", "src": "sprites/band5"}]}}, "code": "// Bobo's Rainbow \u2014 sample game built from a kid's drawing (DoodleQuest).\n// GameShim v1. Bobo the Bear Prince catches falling hearts to repaint the\n// fading rainbow, band by band, so the kitten can cross.\nShim.init({ width: 390, height: 844, background: '#8ecae6' });\n\nvar BAND_NAMES = ['Red', 'Orange', 'Yellow', 'Green', 'Blue', 'Purple'];\nvar HEARTS_TO_WIN = 12;\n\n// The rainbow arch; bands start invisible (faded) and are restored in order.\nvar bands = [];\nfor (var b = 0; b < 6; b++) {\n  bands.push(Shim.sprite('band' + b, { x: 195, y: 560, w: 380, h: 230, visible: false }));\n}\n\n// The kitten waits inside the rainbow's arch.\nvar kitten = Shim.sprite('kitten', { x: 195, y: 600, w: 76, h: 88 });\n\n// Bobo, the player, slides along the bottom of the sky.\nvar bear = Shim.sprite('bear', { x: 195, y: 740, w: 104, h: 192 });\n\nvar hearts = [];\nvar score = 0;\nvar bandsOn = 0;\nvar elapsed = 0;\nvar spawnT = 0;\n\nShim.audio.music('audio/theme.wav', { loop: true, volume: 0.5 });\n\nShim.text('title', \"Bobo's Rainbow\", { x: 16, y: 14, size: 24, color: '#123046' });\nShim.text('score', 'Hearts: 0/12', { x: 16, y: 46, size: 26, color: '#123046' });\nShim.text('banner', '', { x: 16, y: 82, size: 20, color: '#b3402e' });\nShim.text('hint', 'Tap to move Bobo - catch the hearts!', { x: 16, y: 114, size: 18, color: '#123046' });\n\nShim.input('tap', function (x, y) {\n  bear.x = Math.max(52, Math.min(338, x));\n});\n\nfunction restoreBand() {\n  bands[bandsOn].visible = true;\n  Shim.text('banner', BAND_NAMES[bandsOn] + ' restored!', { x: 16, y: 82, size: 20, color: '#b3402e' });\n  bandsOn += 1;\n}\n\nShim.loop(function (dt) {\n  elapsed += dt;\n\n  // Keep hearts coming until the rainbow is whole \u2014 no way to lose.\n  if (score < HEARTS_TO_WIN) {\n    spawnT += dt;\n    if (spawnT > 0.8) {\n      spawnT = 0;\n      var kind = Math.random() < 0.5 ? 'heart' : 'heart_blue';\n      hearts.push(Shim.sprite(kind, { x: 30 + Math.random() * 330, y: -24, w: 46, h: 46 }));\n    }\n  }\n\n  for (var i = hearts.length - 1; i >= 0; i--) {\n    var h = hearts[i];\n    h.y += 175 * dt;\n    var dx = h.x - bear.x;\n    var dy = h.y - (bear.y - 40);\n    if (dx * dx + dy * dy < 3600) {\n      h.visible = false;\n      hearts.splice(i, 1);\n      score += 1;\n      Shim.text('score', 'Hearts: ' + score + '/12', { x: 16, y: 46, size: 26, color: '#123046' });\n      Shim.audio.tone({ freq: 520 + score * 32, dur: 0.12, type: 'sine' });\n      if (score % 2 === 0) {\n        restoreBand();\n      }\n    } else if (h.y > 880) {\n      h.visible = false;\n      hearts.splice(i, 1);\n    }\n  }\n\n  if (score >= HEARTS_TO_WIN) {\n    Shim.text('banner', 'The rainbow is whole! The kitten can cross!',\n      { x: 16, y: 82, size: 20, color: '#1e7b3a' });\n    Shim.audio.tone({ freq: 880, dur: 0.4, type: 'triangle' });\n    Shim.end({ score: score, won: true, stats: { time_s: Math.round(elapsed) } });\n  }\n});\n", "sprites": {"bear": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAScAAAITCAYAAABFWdpnAAEAAElEQVR4nOy9d7xc5XUu/Lxtt2mnqyOEJJCQKJIoQoApBiSKAQMGDMbYRnJJ7OQ6juNrO4HAdXLjm5t2vzi5DnISx7Hj3uIiuWFcMDammo5EsRCSTp+6y9u+P/bs0Wg05+hICGxuWL/fSGdmt3eX99mrPGstssVarEd32QpgQ9v3LQDWAyDNv9H8Pt027ZJtv7VjOzLNulONq12mWm/qcd3StuTWjjWby8ht6f+3A9hom7/f2hrbBtwCbL4N2Gj3uxbdrsFU55Ota5vfCSHNbwR/vvHy//Q4uZBL8wyDzTmT8rO5Sfm48r2FAECMjXWBvwbM9lFjy0Kq7XHAbtJxBACQFrAEWBDyv7SCzRvW4XUmieF6DD35wqgFKZUrVRHFEooyBAP98B6tvb7nl9/76gYAf/buK59/fvcL8/r6B7HHsptu//iXP02       o = o || {};
      texts[id] = { str: String(str), x: o.x || 0, y: o.y || 0, size: o.size || 20, color: o.color || '#fff' };
    },
    input: function (verb, cb) { if (verb === 'tap') inputCb = cb; },
    audio: {
      music: function (src, o) {
        o = o || {};
        try {
          musicEl = new Audio(bundle.music);
          musicEl.loop = !!o.loop;
          musicEl.volume = (o.volume == null) ? 0.6 : o.volume;
          musicEl.play().catch(function () {});
        } catch (e) { /* ignore */ }
      },
      tone: tone
    },
    loop: function (fn) {
      var last = performance.now();
      function frame(t) {
        if (!running) return;
        var dt = Math.min(0.05, (t - last) / 1000);
        last = t;
        try { fn(dt); } catch (e) { running = false; gameError(e); return; }
        draw();
        rafId = requestAnimationFrame(frame);
      }
      rafId = requestAnimationFrame(frame);
    },
    end: function (res) {
      running = false;
      cancelAnimationFrame(rafId);
      if (musicEl) { try { musicEl.pause(); } catch (e) {} }
      showEnd(res || {});
    },
    _sprites: sprites,
    _stop: function () { running = false; cancelAnimationFrame(rafId); if (musicEl) { try { musicEl.pause(); } catch (e) {} } }
  };

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < sprites.length; i++) {
      var s = sprites[i];
      if (!s.visible || !s.img || !s.img.complete) continue;
      ctx.drawImage(s.img, s.x - s.w / 2, s.y - s.h / 2, s.w, s.h);
    }
    for (var k in texts) {
      var t = texts[k];
      ctx.fillStyle = t.color;
      ctx.font = '600 ' + t.size + 'px -apple-system, sans-serif';
      ctx.fillText(t.str, t.x, t.y + t.size);
    }
  }

  cv.onpointerdown = function (ev) {
    if (!inputCb) return;
    var r = cv.getBoundingClientRect();
    var x = (ev.clientX - r.left) / r.width * W;
    var y = (ev.clientY - r.top) / r.height * H;
    try { inputCb(x, y); } catch (e) { gameError(e); }
  };

  return Shim;
}

function gameError(e) {
  var el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'Game error: ' + (e && e.message || e);
}

function showEnd(res) {
  document.getElementById('endtitle').textContent = res.won === false ? 'Game over' : '🎉 You win!';
  var sub = 'Score: ' + (res.score == null ? '—' : res.score);
  if (res.stats && res.stats.time_s != null) sub += ' · ' + res.stats.time_s + 's';
  document.getElementById('endsub').textContent = sub;
  document.getElementById('endcard').style.display = 'flex';
}

function playGame(gameId) {
  show('play');
  document.getElementById('endcard').style.display = 'none';
  document.getElementById('err').style.display = 'none';
  cancelAnimationFrame(rafId);
  Promise.resolve(STANDALONE.manifest).then(function (manifest) {
    currentManifest = manifest;
    var imgs = {};
    var list = (manifest.assets && manifest.assets.sprites) || [];
    var loads = list.map(function (sp) {
      return new Promise(function (resolve) {
        var img = new Image();
        img.onload = function () { imgs[sp.id] = img; resolve(); };
        img.onerror = function () { resolve(); };
        img.src = STANDALONE.sprites[sp.id];
      });
    });
    return Promise.all(loads).then(function () {
      return Promise.resolve(STANDALONE.code).then(function (code) {
        var Shim = makeShim(null, imgs);
        // background
        var bg = '#8ecae6';
        var m = /Shim\.init\(\{\s*[^}]*background:\s*'([^']+)'/.exec(code);
        if (m) bg = m[1];
        document.getElementById('stage').style.background = bg;
        new Function('Shim', code)(Shim);
        document.getElementById('again').onclick = function () { playGame(gameId); };
      });
    });
  }).catch(function (e) { gameError(e); });
}

document.getElementById('back').onclick = function () { playGame('standalone'); };
document.getElementById('togames').onclick = function () { playGame('standalone'); };

playGame('standalone');
</script>
