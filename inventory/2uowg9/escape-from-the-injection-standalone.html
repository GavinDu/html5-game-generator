<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Escape from the Injection — DoodleQuest</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #10142b; color: #fff; }
  header { padding: 14px 18px; font-size: 20px; font-weight: 700; background: #1b2340; position: sticky; top: 0; z-index: 5; }
  header small { display: block; font-size: 12px; font-weight: 400; color: #9fb2ff; }
  #list { padding: 16px; display: grid; gap: 12px; max-width: 560px; margin: 0 auto; }
  .game-card { background: #1b2340; border-radius: 14px; padding: 16px; display: flex; align-items: center; gap: 12px; }
  .game-card .info { flex: 1; }
  .game-card .title { font-size: 18px; font-weight: 700; }
  .game-card .meta { font-size: 13px; color: #9fb2ff; margin-top: 4px; }
  .game-card button { background: #4f7cff; color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font-size: 16px; font-weight: 700; }
  #empty { text-align: center; color: #9fb2ff; padding: 60px 20px; }
  #play { display: none; max-width: 480px; margin: 0 auto; padding: 12px; }
  #stage { position: relative; width: 100%; aspect-ratio: 390 / 844; background: #000; border-radius: 14px; overflow: hidden; touch-action: none; }
  #stage canvas { width: 100%; height: 100%; display: block; }
  #backbar { display: flex; gap: 10px; margin-bottom: 10px; }
  #backbar button { background: #2a3358; color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; font-size: 15px; }
  #endcard { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10, 14, 35, .82); }
  #endcard .box { background: #1b2340; border-radius: 18px; padding: 28px; text-align: center; width: 82%; }
  #endcard h2 { margin: 0 0 8px; font-size: 26px; }
  #endcard p { color: #9fb2ff; margin: 6px 0 18px; }
  #endcard button { background: #4f7cff; color: #fff; border: 0; border-radius: 12px; padding: 14px 26px; font-size: 17px; font-weight: 700; margin: 4px; }
  #err { display:none; background:#5b1f1f; color:#ffd7d7; border-radius:10px; padding:12px; margin-top:10px; font-size:13px; white-space:pre-wrap; }
  #endlevel { color:#ffe27a; font-weight:700; margin:2px 0 10px; font-size:17px; }
  #lbwrap { margin:6px 0 12px; text-align:left; }
  #lbtitle { font-weight:700; font-size:15px; margin-bottom:6px; }
  #lb { max-height:150px; overflow-y:auto; display:grid; gap:4px; }
  .lbrow { display:flex; justify-content:space-between; background:#252e57; border-radius:8px; padding:7px 10px; font-size:14px; }
  .lbrow.me { background:#3b4a8f; font-weight:700; }
  #namerow { font-size:14px; color:#9fb2ff; margin-bottom:12px; }
  #pname { background:#252e57; color:#fff; border:1px solid #3b4a8f; border-radius:8px; padding:8px 10px; font-size:15px; width:150px; }
</style>
</head>
<body>
<header>🎮 DoodleQuest Player<small>games generated from kids' drawings</small></header>

<div id="list"></div>

<div id="play">
  <div id="backbar"><button id="back">← Games</button></div>
  <div id="stage">
    <canvas id="cv" width="390" height="844"></canvas>
    <div id="endcard"><div class="box">
      <h2 id="endtitle">You win!</h2>
      <p id="endsub"></p>
      <p id="endlevel"></p>
      <div id="lbwrap"><div id="lbtitle">🏆 Leaderboard</div><div id="lb"></div></div>
      <div id="namerow">Name: <input id="pname" maxlength="24" placeholder="Player"></div>
      <button id="again">Play again</button>
      <button id="togames">Games</button>
    </div></div>
  </div>
  <div id="err"></div>
</div>

<script>
var STANDALONE = {"manifest": {"name": "Escape from the Injection", "assets": {"sprites": [{"id": "blob", "src": "sprites/blob"}, {"id": "chaser", "src": "sprites/chaser"}, {"id": "syringe", "src": "sprites/syringe"}, {"id": "star", "src": "sprites/star"}, {"id": "bg0", "src": "sprites/bg0"}, {"id": "bg1", "src": "sprites/bg1"}, {"id": "bg2", "src": "sprites/bg2"}]}}, "code": "// Escape from the Injection \u2014 GameShim v1\n//\n// From a kid's drawing and handwritten plot:\n//   1. \"Inject in the butt\"         \u2014 the blob is about to get a shot\n//   2. \"escape further and further\" \u2014 flee through new places, faster each time\n//   3. \"finally, he is caught and Injected with tears\"\n//\n// You are the blob. Tap the LEFT / RIGHT side of the screen to switch lanes.\n// Dodge the syringes, grab courage stars, and keep ahead of the chaser.\n// Every 40 seconds you escape somewhere new and everything gets quicker.\n// Get caught and it's a shot in the butt... with tears.\n\nShim.init({ width: 390, height: 844, background: '#d8f3e3' });\n\nvar LANES = [90, 195, 300];\nvar LEVEL_SECS = 40;\nvar LEVEL_NAMES = ['Clinic', 'Hallway', 'Playground', 'Park', 'Beach', 'Mall'];\nvar LEVEL_EMOJI = ['\ud83c\udfe5', '\ud83c\udfc3', '\ud83d\udedd', '\ud83c\udf33', '\ud83c\udfd6\ufe0f', '\ud83d\udecd\ufe0f'];\nvar GAP_START = 220, GAP_MAX = 250, GAP_CAUGHT = 55;\n\n// Backdrops first so the characters draw on top.\nvar bgs = [];\nfor (var bi = 0; bi < 3; bi++) {\n  bgs.push(Shim.sprite('bg' + bi, { x: 195, y: 422, w: 390, h: 844 }));\n}\nbgs[1].visible = false;\nbgs[2].visible = false;\n\nvar lane = 1;\nvar blob = Shim.sprite('blob', { x: LANES[1], y: 680, w: 112, h: 128 });\nvar chaser = Shim.sprite('chaser', { x: LANES[1], y: 680 + GAP_START, w: 105, h: 122 });\n\nShim.text('title', '\ud83d\udc89 Escape from the Injection', { x: 16, y: 14, size: 24, color: '#123046' });\nShim.text('meta', 'LV 1 \u00b7 Clinic \ud83c\udfe5', { x: 16, y: 46, size: 22, color: '#1e7b3a' });\nShim.text('score', 'Score: 0', { x: 296, y: 14, size: 24, color: '#123046' });\nShim.text('hint', 'Tap \u25c0 left / right \u25b6 to dodge!\\nTip: stay in the middle lane.', { x: 16, y: 78, size: 18, color: '#123046' });\nShim.text('banner', '', { x: 16, y: 140, size: 24, color: '#b3402e' });\n\nShim.audio.music('audio/theme.wav', { loop: true, volume: 0.45 });\n\nvar items = [];           // { s, kind: 'syringe' | 'star', lane }\nvar gap = GAP_START;\nvar score = 0;\nvar elapsed = 0, levelT = 0, spawnT = 0, starT = 3, hintT = 0, bannerT = 0;\nvar metaLevel = 1, metaMult = 1;\nvar over = false, ended = false, cried = false, catchT = 0;\n\nfunction levelName(n) {\n  if (n <= LEVEL_NAMES.length) return LEVEL_NAMES[n - 1] + ' ' + LEVEL_EMOJI[n - 1];\n  return 'Nowhere Left \ud83d\ude31';\n}\n\nfunction spawnSyringe() {\n  // Fairness: never build an unavoidable 3-lane wall. If two lanes already\n  // have \"young\" syringes (spawned <0.6s ago, arriving together), stack the\n  // new one into one of those lanes so the third lane stays escapable.\n  var young = {};\n  for (var i = 0; i < items.length; i++) {\n    var it = items[i];\n    if (it.kind === 'syringe' && elapsed - it.born < 0.6) young[it.lane] = true;\n  }\n  var lanes = Object.keys(young);\n  var l = lanes.length >= 2\n    ? parseInt(lanes[Math.floor(Math.random() * lanes.length)], 10)\n    : Math.floor(Math.random() * 3);\n  var s = Shim.sprite('syringe', { x: LANES[l], y: -60, w: 56, h: 84 });\n  items.push({ s: s, kind: 'syringe', lane: l, born: elapsed });\n}\n\nfunction spawnStar() {\n  var l = Math.floor(Math.random() * 3);\n  var s = Shim.sprite('star', { x: LANES[l], y: -40, w: 52, h: 52 });\n  items.push({ s: s, kind: 'star', lane: l });\n}\n\nfunction removeItem(i) {\n  items[i].s.visible = false;\n  items.splice(i, 1);\n}\n\nfunction setScore() {\n  Shim.text('score', 'Score: ' + Math.round(score), { x: 296, y: 14, size: 24, color: '#123046' });\n}\n\nShim.input('tap', function (x, y) {\n  if (over) return;\n  if (x < 195 && lane > 0) {\n    lane--;\n    Shim.audio.tone({ freq: 520, dur: 0.06, type: 'sine' });\n  } else if (x >= 195 && lane < 2) {\n    lane++;\n    Shim.audio.tone({ freq: 620, dur: 0.06, type: 'sine' });\n  }\n});\n\nShim.loop(function (dt) {\n  if (ended) return;\n\n  // ---- caught sequence: the chaser lunges, then the tears ----\n  if (over) {\n    catchT += dt;\n    gap = Math.max(0, gap - 420 * dt);\n    chaser.x += (blob.x - chaser.x) * Math.min(1, dt * 10);\n    chaser.y = 680 + gap;\n    if (catchT > 0.55 && !cried) {\n      cried = true;\n      Shim.text('banner', '\ud83d\ude2d Injected in the butt...', { x: 16, y: 140, size: 24, color: '#b3402e' });\n      Shim.audio.tone({ freq: 220, dur: 0.5, type: 'sawtooth' });\n    }\n    if (catchT > 1.7) {\n      ended = true;\n      Shim.end({ won: false, score: Math.round(score),\n                 stats: { level: metaLevel, time_s: Math.round(elapsed) } });\n    }\n    return;\n  }\n\n  elapsed += dt;\n  score += dt * 10;\n  setScore();\n\n  if (hintT < 4) {\n    hintT += dt;\n    if (hintT >= 4) Shim.text('hint', '', { x: 16, y: 78, size: 18, color: '#123046' });\n  }\n  if (bannerT > 0) {\n    bannerT -= dt;\n    if (bannerT <= 0) Shim.text('banner', '', { x: 16, y: 140, size: 24, color: '#b3402e' });\n  }\n\n  // ---- escape to a new place every LEVEL_SECS: quicker and quicker ----\n  levelT += dt;\n  if (levelT >= LEVEL_SECS) {\n    levelT = 0;\n    metaLevel++;\n    metaMult *= 1.12;\n    var li = (metaLevel - 1) % 3;\n    for (var k = 0; k < 3; k++) {\n      bgs[k].visible = (k === li);\n    }\n    Shim.text('meta', 'LV ' + metaLevel + ' \u00b7 ' + levelName(metaLevel),\n              { x: 16, y: 46, size: 22, color: '#1e7b3a' });\n    Shim.text('banner', 'LEVEL ' + metaLevel + '! Faster! ' + levelName(metaLevel),\n              { x: 16, y: 140, size: 24, color: '#b3402e' });\n    bannerT = 2.5;\n    Shim.audio.tone({ freq: 880, dur: 0.25, type: 'square' });\n  }\n\n  // ---- the blob slides toward its lane; the chaser trails behind ----\n  var tx = LANES[lane];\n  blob.x += (tx - blob.x) * Math.min(1, dt * 12);\n  chaser.x += (blob.x - chaser.x) * Math.min(1, dt * 5);\n  chaser.y = 680 + gap;\n\n  // ---- spawn syringes and stars ----\n  var capped = Math.min(metaMult, 3.2);\n  var speed = 210 * capped;\n  spawnT += dt;\n  if (spawnT >= Math.max(0.55, 1.3 / capped)) {\n    spawnT = 0;\n    spawnSyringe();\n  }\n  starT += dt;\n  if (starT >= 2.5) {\n    starT = 0;\n    spawnStar();\n  }\n\n  // ---- move everything down; collisions ----\n  for (var i = items.length - 1; i >= 0; i--) {\n    var it = items[i];\n    it.s.y += speed * dt;\n    if (it.kind === 'syringe') {\n      if (Math.abs(it.s.y - 680) < 60 && Math.abs(it.s.x - blob.x) < 50) {\n        gap -= 45;\n        Shim.audio.tone({ freq: 150, dur: 0.2, type: 'sawtooth' });\n        removeItem(i);\n        continue;\n      }\n    } else {\n      if (Math.abs(it.s.y - 680) < 60 && Math.abs(it.s.x - blob.x) < 55) {\n        score += 25;\n        gap = Math.min(GAP_MAX, gap + 12);\n        Shim.audio.tone({ freq: 990, dur: 0.12, type: 'sine' });\n        removeItem(i);\n        setScore();\n        continue;\n      }\n    }\n    if (it.s.y > 920) removeItem(i);\n  }\n\n  // ---- clean running slowly rebuilds the lead ----\n  gap = Math.min(GAP_MAX, gap + 6 * dt);\n\n  // ---- caught? the plot says he is finally caught ----\n  if (gap <= GAP_CAUGHT) {\n    over = true;\n    catchT = 0;\n    Shim.text('banner', '\ud83d\udc89 CAUGHT!', { x: 16, y: 140, size: 24, color: '#b3402e' });\n    Shim.text('hint', '', { x: 16, y: 78, size: 18, color: '#123046' });\n    Shim.audio.tone({ freq: 180, dur: 0.4, type: 'sawtooth' });\n  }\n});\n", "sprites": {"blob": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIwAAACgCAYAAADeroRzAAAHwklEQVR4nO2dzZHeNgyG4UzqiMcTH+Kzy0ghqSmFpAyf48N6PHEjyYkZrVYUSRA/LyA8x539JAJ8BFLUH1FRFEVRFEVRJOeddwM8+fWX3/7l/vbbj6+PzN1jgt6RY5YnSJQ2QAtBRmQUKFVACJL0yCJPiiCQRTkTXZywjY8kSY+I8o       var s = { id: id, x: o.x || 0, y: o.y || 0, w: o.w || 64, h: o.h || 64,
                visible: o.visible !== false, img: spriteImgs[id] || null };
      sprites.push(s);
      return s;
    },
    text: function (id, str, o) {
      o = o || {};
      texts[id] = { str: String(str), x: o.x || 0, y: o.y || 0, size: o.size || 20, color: o.color || '#fff' };
    },
    input: function (verb, cb) { if (verb === 'tap') inputCb = cb; },
    audio: {
      music: function (src, o) {
        o = o || {};
        try {
          musicEl = new Audio(bundle.music);
          musicEl.loop = !!o.loop;
          musicEl.volume = (o.volume == null) ? 0.6 : o.volume;
          musicEl.play().catch(function () {});
        } catch (e) { /* ignore */ }
      },
      tone: tone
    },
    loop: function (fn) {
      var last = performance.now();
      function frame(t) {
        if (!running) return;
        var dt = Math.min(0.05, (t - last) / 1000);
        last = t;
        try { fn(dt); } catch (e) { running = false; gameError(e); return; }
        draw();
        rafId = requestAnimationFrame(frame);
      }
      rafId = requestAnimationFrame(frame);
    },
    end: function (res) {
      running = false;
      cancelAnimationFrame(rafId);
      if (musicEl) { try { musicEl.pause(); } catch (e) {} }
      showEnd(res || {});
    },
    _sprites: sprites,
    _stop: function () { running = false; cancelAnimationFrame(rafId); if (musicEl) { try { musicEl.pause(); } catch (e) {} } }
  };

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < sprites.length; i++) {
      var s = sprites[i];
      if (!s.visible || !s.img || !s.img.complete) continue;
      ctx.drawImage(s.img, s.x - s.w / 2, s.y - s.h / 2, s.w, s.h);
    }
    for (var k in texts) {
      var t = texts[k];
      ctx.fillStyle = t.color;
      ctx.font = '600 ' + t.size + 'px -apple-system, sans-serif';
      ctx.fillText(t.str, t.x, t.y + t.size);
    }
  }

  cv.onpointerdown = function (ev) {
    if (!inputCb) return;
    var r = cv.getBoundingClientRect();
    var x = (ev.clientX - r.left) / r.width * W;
    var y = (ev.clientY - r.top) / r.height * H;
    try { inputCb(x, y); } catch (e) { gameError(e); }
  };

  return Shim;
}

function gameError(e) {
  var el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'Game error: ' + (e && e.message || e);
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showEnd(res) {
  document.getElementById('endtitle').textContent = res.won === false ? 'Game over' : '🎉 You win!';
  var sub = 'Score: ' + (res.score == null ? '—' : res.score);
  if (res.stats && res.stats.time_s != null) sub += ' · ' + res.stats.time_s + 's';
  document.getElementById('endsub').textContent = sub;
  lastScore = res.score || 0;
  lastLevel = (res.stats && res.stats.level) || 1;
  document.getElementById('endlevel').textContent = 'Reached Level ' + lastLevel;
  document.getElementById('lb').innerHTML = '<div class="lbrow">Saving score…</div>';
  document.getElementById('endcard').style.display = 'flex';
  submitScore();
}

function playerName() {
  var saved = '';
  try { saved = localStorage.getItem('dq_name') || ''; } catch (e) {}
  var input = document.getElementById('pname');
  if (input && !input.value && saved) input.value = saved;
  var name = ((input && input.value) || saved || 'Player').slice(0, 24);
  try { localStorage.setItem('dq_name', name); } catch (e) {}
  return name;
}

// The leaderboard records each run's level (then score); best run per name.
function submitScore() {
  if (!currentGameId) { loadLeaderboard(''); return; }
  var name = playerName();
  var body = JSON.stringify({ name: name, score: lastScore, level: lastLevel });
  fetch(API + '/v1/games/' + currentGameId + '/scores', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body
  }).then(function () { loadLeaderboard(name); },
          function () { loadLeaderboard(name); });
}

function loadLeaderboard(me) {
  if (!currentGameId) return;
  fetch(API + '/v1/games/' + currentGameId + '/leaderboard')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var rows = (data && data.scores) || [];
      var lb = document.getElementById('lb');
      if (!rows.length) {
        lb.innerHTML = '<div class="lbrow">No scores yet — be the first!</div>';
        return;
      }
      lb.innerHTML = rows.map(function (s, i) {
        var cls = (me && s.name === me) ? 'lbrow me' : 'lbrow';
        return '<div class="' + cls + '"><span>#' + (i + 1) + ' ' + escapeHtml(s.name) + '</span>' +
          '<span>LV ' + s.level + ' · ' + s.score + '</span></div>';
      }).join('');
    })
    .catch(function () {
      document.getElementById('lb').innerHTML = '<div class="lbrow">Leaderboard unavailable</div>';
    });
}

function playGame(gameId) {
  currentGameId = gameId;
  show('play');
  document.getElementById('endcard').style.display = 'none';
  document.getElementById('err').style.display = 'none';
  cancelAnimationFrame(rafId);
  Promise.resolve(STANDALONE.manifest).then(function (manifest) {
    currentManifest = manifest;
    var imgs = {};
    var list = (manifest.assets && manifest.assets.sprites) || [];
    var loads = list.map(function (sp) {
      return new Promise(function (resolve) {
        var img = new Image();
        img.onload = function () { imgs[sp.id] = img; resolve(); };
        img.onerror = function () { resolve(); };
        img.src = STANDALONE.sprites[sp.id];
      });
    });
    return Promise.all(loads).then(function () {
      return Promise.resolve(STANDALONE.code).then(function (code) {
        var Shim = makeShim(null, imgs);
        // background
        var bg = '#8ecae6';
        var m = /Shim\.init\(\{\s*[^}]*background:\s*'([^']+)'/.exec(code);
        if (m) bg = m[1];
        document.getElementById('stage').style.background = bg;
        new Function('Shim', code)(Shim);
        document.getElementById('again').onclick = function () { playGame(gameId); };
      });
    });
  }).catch(function (e) { gameError(e); });
}

document.getElementById('back').onclick = function () { playGame('standalone'); };
document.getElementById('togames').onclick = function () { playGame('standalone'); };

playGame('standalone');
</script>
