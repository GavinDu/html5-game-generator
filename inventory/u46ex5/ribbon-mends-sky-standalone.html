<style>

<script>
var STANDALONE = {"manifest": {"name": "\u98d8\u5e26\u8865\u5929 Ribbon Mends the Sky", "assets": {"sprites": [{"id": "bg", "src": "sprites/bg"}, {"id": "hero", "src": "sprites/hero"}, {"id": "demon", "src": "sprites/demon"}, {"id": "hole", "src": "sprites/hole"}, {"id": "hole_closed", "src": "sprites/hole_closed"}, {"id": "shard", "src": "sprites/shard"}, {"id": "spark", "src": "sprites/spark"}]}}, "code": "// \u98d8\u5e26\u8865\u5929 Ribbon Mends the Sky \u2014 built from a photo (DoodleQuest).\n// GameShim v1. The little hero rides her cloud: tap to fly, dive through\n// dark sky-holes so her ribbons stitch them shut, tap wind demons to bonk\n// them with the golden staff, catch rainbow shards for bonus.\nShim.init({ width: 390, height: 844, background: '#3a4a7a' });\n\nvar HOLES_TO_WIN = 6;\nvar holes = [];   // {open, closed, x, y, ty, stitched}\nvar demons = [];  // {s, x, y, sway}\nvar shards = [];  // {s, x, y}\nvar sparks = [];  // {s, x, y, t}\nvar score = 0;\nvar stitched = 0;\nvar elapsed = 0;\nvar holesSpawned = 0;\nvar spawnHoleT = 0;\nvar spawnDemonT = 3;\nvar spawnShardT = 1.5;\nvar won = false;\nvar winT = -1;\nvar winTones = [];\n\n// Sunset cloud-sea world, drawn under everything.\nShim.sprite('bg', { x: 195, y: 422, w: 390, h: 844 });\n\nvar hero = Shim.sprite('hero', { x: 195, y: 660, w: 150, h: 96 });\nvar hx = 195, hy = 660, tx = 195, ty = 660;\n\n// Sparkle pool for stitch/collect/bonk bursts.\nfor (var sp = 0; sp < 6; sp++) {\n  sparks.push({ s: Shim.sprite('spark', { x: -50, y: -50, w: 46, h: 46, visible: false }), x: 0, y: 0, t: 0 });\n}\n\nShim.audio.music('audio/theme.wav', { loop: true, volume: 0.5 });\n\nShim.text('title', '\u98d8\u5e26\u8865\u5929', { x: 16, y: 12, size: 30, color: '#ffffff' });\nShim.text('score', '\ud83c\udf08 0/6  \u2b50 0', { x: 16, y: 48, size: 24, color: '#ffffff' });\nShim.text('banner', '', { x: 16, y: 84, size: 22, color: '#ffe27a' });\nShim.text('hint1', '\ud83d\udc46 \u70b9\u54ea\u91cc\uff0c\u4e91\u6735\u5c31\u98de\u5230\u54ea\u91cc', { x: 16, y: 796, size: 17, color: '#ffffff' });\nShim.text('hint2', '\ud83c\udf80 \u94bb\u8fc7\u9ed1\u6d1e\u7f1d\u8865\u5929\u7a7a  \ud83d\udd28 \u70b9\u98ce\u5996\u6572\u5b83', { x: 16, y: 818, size: 17, color: '#ffffff' });\n\nfunction setScore() {\n  Shim.text('score', '\ud83c\udf08 ' + stitched + '/' + HOLES_TO_WIN + '  \u2b50 ' + score,\n    { x: 16, y: 48, size: 24, color: '#ffffff' });\n}\n\nfunction burst(x, y) {\n  for (var i = 0; i < 3; i++) {\n    var p = sparks[(Math.floor(Math.random() * sparks.length))];\n    p.x = x + (Math.random() * 70 - 35);\n    p.y = y + (Math.random() * 70 - 35);\n    p.t = 0.5;\n    p.s.w = 46; p.s.h = 46;\n    p.s.visible = true;\n  }\n}\n\nfunction spawnHole() {\n  holesSpawned += 1;\n  var x = 60 + Math.random() * 270;\n  var open = Shim.sprite('hole', { x: x, y: -70, w: 110, h: 110 });\n  var closed = Shim.sprite('hole_closed', { x: x, y: -70, w: 110, h: 110, visible: false });\n  holes.push({ open: open, closed: closed, x: x, y: -70, ty: 170 + Math.random() * 380, stitched: false });\n}\n\nfunction spawnDemon() {\n  var x = 50 + Math.random() * 290;\n  var s = Shim.sprite('demon', { x: x, y: -50, w: 64, h: 78 });\n  demons.push({ s: s, x: x, y: -50, sway: Math.random() * 6 });\n}\n\nfunction spawnShard() {\n  var x = 50 + Math.random() * 290;\n  var s = Shim.sprite('shard', { x: x, y: -40, w: 44, h: 90 });\n  shards.push({ s: s, x: x, y: -40 });\n}\n\nfunction stitchHole(h) {\n  h.stitched = true;\n  h.open.visible = false;\n  h.closed.visible = true;\n  stitched += 1;\n  burst(h.x, h.y);\n  setScore();\n  Shim.audio.tone({ freq: 520 + stitched * 60, dur: 0.15, type: 'sine' });\n  if (stitched >= HOLES_TO_WIN) {\n    Shim.text('banner', '\u5929\u7a7a\u8865\u597d\u5566\uff01\ud83c\udf08', { x: 16, y: 84, size: 24, color: '#ffe27a' });\n    winT = 0;\n    winTones = [\n      { at: 0, freq: 523 }, { at: 0.22, freq: 659 },\n      { at: 0.44, freq: 784 }, { at: 0.66, freq: 1047 }\n    ];\n  } else {\n    Shim.text('banner', '\u8865\u597d\u5566\uff01 ' + stitched + '/' + HOLES_TO_WIN + ' \ud83c\udf80',\n      { x: 16, y: 84, size: 22, color: '#ffe27a' });\n  }\n}\n\nfunction bonkDemon(d) {\n  var i = demons.indexOf(d);\n  if (i >= 0) demons.splice(i, 1);\n  d.s.visible = false;\n  score += 20;\n  setScore();\n  burst(d.x, d.y);\n  Shim.audio.tone({ freq: 200, dur: 0.15, type: 'triangle' });\n}\n\nShim.input('tap', function (x, y) {\n  // A tap that lands on a demon bonks it with the staff.\n  var best = null, bestD = 65 * 65;\n  for (var i = 0; i < demons.length; i++) {\n    var d = demons[i];\n    var dx = d.x - x, dy = d.y - y;\n    var dd = dx * dx + dy * dy;\n    if (dd < bestD) { bestD = dd; best = d; }\n  }\n  if (best) bonkDemon(best);\n  // Otherwise she flies to the tap point.\n  tx = Math.max(40, Math.min(350, x));\n  ty = Math.max(120, Math.min(780, y));\n});\n\nShim.loop(function (dt) {\n  elapsed += dt;\n\n  // Cloud flight: glide toward the tap point, with a gentle bob.\n  var k = Math.min(1, dt * 5);\n  hx += (tx - hx) * k;\n  hy += (ty - hy) * k;\n  hero.x = hx;\n  hero.y = hy + Math.sin(elapsed * 4) * 6;\n\n  // Sky-holes drift in.\n  if (holesSpawned < HOLES_TO_WIN) {\n    spawnHoleT += dt;\n    if (spawnHoleT > 2.2) { spawnHoleT = 0; spawnHole(); }\n  }\n  for (var i = 0; i < holes.length; i++) {\n    var h = holes[i];\n    if (h.y < h.ty) {\n      h.y += 22 * dt;\n      if (h.y > h.ty) h.y = h.ty;\n      h.open.y = h.y;\n      h.closed.y = h.y;\n    }\n    if (!h.stitched) {\n      var dx = hx - h.x, dy = hy - h.y;\n      if (dx * dx + dy * dy < 60 * 60) stitchHole(h);\n    }\n  }\n\n  // Wind demons bumble down.\n  spawnDemonT += dt;\n  if (spawnDemonT > 4 && demons.length < 3) { spawnDemonT = 0; spawnDemon(); }\n  for (var i = demons.length - 1; i >= 0; i--) {\n    var d = demons[i];\n    d.y += 55 * dt;\n    d.sway += dt * 3;\n    d.x += Math.sin(d.sway) * 30 * dt;\n    d.s.x = d.x;\n    d.s.y = d.y;\n    if (d.y > 900) { d.s.visible = false; demons.splice(i, 1); }\n  }\n\n  // Rainbow shards drift by.\n  spawnShardT += dt;\n  if (spawnShardT > 3 && shards.length < 4) { spawnShardT = 0; spawnShard(); }\n  for (var i = shards.length - 1; i >= 0; i--) {\n    var sh = shards[i];\n    sh.y += 75 * dt;\n    sh.s.y = sh.y;\n    var dx = hx - sh.x, dy = hy - sh.y;\n    if (dx * dx + dy * dy < 50 * 50) {\n      sh.s.visible = false;\n      shards.splice(i, 1);\n      score += 10;\n      setScore();\n      burst(sh.x, sh.y);\n      Shim.audio.tone({ freq: 740 + score, dur: 0.12, type: 'sine' });\n    } else if (sh.y > 900) {\n      sh.s.visible = false;\n      shards.splice(i, 1);\n    }\n  }\n\n  // Sparkle bursts grow and fade.\n  for (var i = 0; i < sparks.length; i++) {\n    var p = sparks[i];\n    if (p.t > 0) {\n      p.t -= dt;\n      var grow = 1 + (0.5 - p.t) * 1.6;\n      p.s.w = 46 * grow;\n      p.s.h = 46 * grow;\n      p.s.x = p.x;\n      p.s.y = p.y;\n      if (p.t <= 0) p.s.visible = false;\n    }\n  }\n\n  // Win fanfare, then end.\n  if (winT >= 0) {\n    winT += dt;\n    while (winTones.length && winTones[0].at <= winT) {\n      var t = winTones.shift();\n      Shim.audio.tone({ freq: t.freq, dur: 0.25, type: 'triangle' });\n    }\n    if (winT > 1.1 && !won) {\n      won = true;\n      Shim.end({ score: score, won: true, stats: { time_s: Math.round(elapsed) } });\n    }\n  }\n});\n", "sprites": {"bg": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCANMAYYDASIAAhEBAxEB/8QAGwAAAwEBAQEBAAAAAAAAAAAAAgMEAQUABgf/xAA3EAACAgEEAQMEAQMDAwQDAQEBAgARAwQSITFBE1FhBSIycYEUQpEjUqFiscEVM0Ny0eHwgqL/xAAaAQADAQEBAQAAAAAAAAAAAAAAAQIDBAUG/8QAIxEBAQEBAAICAwEBAQEBAAAAAAERAhIhAzETQVEiYQRxFP/aAAwDAQACEQMRAD8AghopPiYARzUdiYWBU7qcgTiPiaVAWiOfeVKsVqFAAi08S1PQ6nqj0sBCEKp6ojengamgT22TTGriHEgcwxYk2LlGRcCuYe7iZ5ih14QqmCEIqIJRDHEAGo <script>
'use strict';
var API = '';
var W = 390, H = 844;
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var currentManifest = null;
var rafId = 0;

function show(id) {
  document.getElementById('list').style.display = id === 'list' ? '' : 'none';
  document.getElementById('play').style.display = id === 'play' ? 'block' : 'none';
}

// ---- GameShim v1 runtime ----
function makeShim(bundleBase, spriteImgs) {
  var sprites = [];
  var texts = {};
  var inputCb = null;
  var audioCtx = null;
  var musicEl = null;
  var running = true;

  function tone(o) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.value = o.freq || 440;
      g.gain.setValueAtTime(0.25, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (o.dur || 0.15));
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + (o.dur || 0.15));
    } catch (e) { /* audio unavailable */ }
  }

  var Shim = {
    init: function (o) { W = o.width || 390; H = o.height || 844; cv.width = W; cv.height = H; },
    sprite: function (id, o) {
      o = o || {};
      var s = { id: id, x: o.x || 0, y: o.y || 0, w: o.w || 64, h: o.h || 64,
                visible: o.visible !== false, img: spriteImgs[id] || null };
      sprites.push(s);
      return s;
    },
    text: function (id, str, o) {
      o = o || {};
      texts[id] = { str: String(str), x: o.x || 0, y: o.y || 0, size: o.size || 20, color: o.color || '#fff' };
    },
    input: function (verb, cb) { if (verb === 'tap') inputCb = cb; },
    audio: {
      music: function (src, o) {
        o = o || {};
        try {
          musicEl = new Audio(bundle.music);
          musicEl.loop = !!o.loop;
          musicEl.volume = (o.volume == null) ? 0.6 : o.volume;
          musicEl.play().catch(function () {});
        } catch (e) { /* ignore */ }
      },
      tone: tone
    },
    loop: function (fn) {
      var last = performance.now();
      function frame(t) {
        if (!running) return;
        var dt = Math.min(0.05, (t - last) / 1000);
        last = t;
        try { fn(dt); } catch (e) { running = false; gameError(e); return; }
        draw();
        rafId = requestAnimationFrame(frame);
      }
      rafId = requestAnimationFrame(frame);
    },
    end: function (res) {
      running = false;
      cancelAnimationFrame(rafId);
      if (musicEl) { try { musicEl.pause(); } catch (e) {} }
      showEnd(res || {});
    },
    _sprites: sprites,
    _stop: function () { running = false; cancelAnimationFrame(rafId); if (musicEl) { try { musicEl.pause(); } catch (e) {} } }
  };

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < sprites.length; i++) {
      var s = sprites[i];
      if (!s.visible || !s.img || !s.img.complete) continue;
      ctx.drawImage(s.img, s.x - s.w / 2, s.y - s.h / 2, s.w, s.h);
    }
    for (var k in texts) {
      var t = texts[k];
      ctx.fillStyle = t.color;
      ctx.font = '600 ' + t.size + 'px -apple-system, sans-serif';
      ctx.fillText(t.str, t.x, t.y + t.size);
    }
  }

  cv.onpointerdown = function (ev) {
    if (!inputCb) return;
    var r = cv.getBoundingClientRect();
    var x = (ev.clientX - r.left) / r.width * W;
    var y = (ev.clientY - r.top) / r.height * H;
    try { inputCb(x, y); } catch (e) { gameError(e); }
  };

  return Shim;
}

function gameError(e) {
  var el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'Game error: ' + (e && e.message || e);
}

function showEnd(res) {
  document.getElementById('endtitle').textContent = res.won === false ? 'Game over' : '🎉 You win!';
  var sub = 'Score: ' + (res.score == null ? '—' : res.score);
  if (res.stats && res.stats.time_s != null) sub += ' · ' + res.stats.time_s + 's';
  document.getElementById('endsub').textContent = sub;
  document.getElementById('endcard').style.display = 'flex';
}

function playGame(gameId) {
  show('play');
  document.getElementById('endcard').style.display = 'none';
  document.getElementById('err').style.display = 'none';
  cancelAnimationFrame(rafId);
  Promise.resolve(STANDALONE.manifest).then(function (manifest) {
    currentManifest = manifest;
    var imgs = {};
    var list = (manifest.assets && manifest.assets.sprites) || [];
    var loads = list.map(function (sp) {
      return new Promise(function (resolve) {
        var img = new Image();
        img.onload = function () { imgs[sp.id] = img; resolve(); };
        img.onerror = function () { resolve(); };
        img.src = STANDALONE.sprites[sp.id];
      });
    });
    return Promise.all(loads).then(function () {
      return Promise.resolve(STANDALONE.code).then(function (code) {
        var Shim = makeShim(null, imgs);
        // background
        var bg = '#8ecae6';
        var m = /Shim\.init\(\{\s*[^}]*background:\s*'([^']+)'/.exec(code);
        if (m) bg = m[1];
        document.getElementById('stage').style.background = bg;
        new Function('Shim', code)(Shim);
        document.getElementById('again').onclick = function () { playGame(gameId); };
      });
    });
  }).catch(function (e) { gameError(e); });
}

document.getElementById('back').onclick = function () { playGame('standalone'); };
document.getElementById('togames').onclick = function () { playGame('standalone'); };

playGame('standalone');
</script>
